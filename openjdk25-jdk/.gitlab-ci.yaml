---
openjdk25-jdk:
  tags:
    - dc02
  stage: build
  rules:
    - changes:
        - openjdk25-jdk/**/*
    - changes:
        - openjdk25-jre/**/*
  needs:
    - job: openjdk25-jre
      optional: true
  image: $REPO_URL/buildah:latest
  script: |-
    set -euxo pipefail
    buildah login -u $REPO_USERNAME -p $REPO_PASSWORD $REPO_URL
    buildah build -t $REPO_URL/openjdk25-jdk --network=host \
    --build-arg BASE_IMAGES_REPO=${REPO_URL} \
    ./openjdk25-jdk/
    buildah push $REPO_URL/openjdk25-jdk
