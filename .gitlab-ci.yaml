---
bootstrap:
  tags:
    - dc02
  stage: build
  rules:
    - changes:
        - bootstrap/**/*
  image: repo.skarbek.name/p-con-docker/redhat/ubi10:10.1
  script: |
    dnf clean all
    dnf -y install buildah fuse-overlayfs
    buildah login -u $REPO_USERNAME -p $REPO_PASSWORD $REPO_URL
    buildah build -t $REPO_URL/buildah --network=host ./bootstrap/
    buildah push $REPO_URL/buildah
ubi10:
  tags:
    - dc02
  stage: build
  rules:
    - changes:
        - ubi10/**/*
  needs:
    - job: bootstrap
  image: $REPO_URL/buildah:latest
  script: |
    buildah login -u $REPO_USERNAME -p $REPO_PASSWORD $REPO_URL
    buildah build -t $REPO_URL/ubi10:10.1 --network=host ./ubi10/
    buildah push $REPO_URL/ubi10:10.1
