---
.rules_template: &default_rules
  - if: '$CI_COMMIT_MESSAGE  !~ /^wip(.?)*/'
    when: always
variables:
  BASE_IMAGES_REPO: repo.skarbek.name/p-con-docker/redhat
  PROJ_IMAGES_REPO: repo.skarbek.name/h-con-infra
include:
  - local: airflow/.gitlab-ci.yaml
  - local: ansible/.gitlab-ci.yaml
  - local: bento/.gitlab-ci.yaml
  - local: bootstrap/.gitlab-ci.yaml
  - local: buildah/.gitlab-ci.yaml
  - local: caddy/.gitlab-ci.yaml
  - local: golang/.gitlab-ci.yaml
  - local: jellyfin/.gitlab-ci.yaml
  - local: python/.gitlab-ci.yaml
  - local: rabbitmq/.gitlab-ci.yaml
  - local: rclone/.gitlab-ci.yaml
  - local: rust/.gitlab-ci.yaml
  - local: rustfs/.gitlab-ci.yaml
  - local: tinyproxy/.gitlab-ci.yaml
  - local: ubi10-minimal/.gitlab-ci.yaml
  - local: yt-dlp/.gitlab-ci.yaml
  - local: zensical/.gitlab-ci.yaml
  - local: openjdk21-jre/.gitlab-ci.yaml
  - local: openjdk21-jdk/.gitlab-ci.yaml
  - local: openjdk25-jre/.gitlab-ci.yaml
  - local: openjdk25-jdk/.gitlab-ci.yaml
  - local: unftp/.gitlab-ci.yaml
