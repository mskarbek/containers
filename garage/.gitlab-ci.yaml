---
garage:
  tags:
    - dc02
  stage: build
  rules:
    - changes:
        - garage/**/*
  needs:
    - job: ubi10
      optional: true
  image: $REPO_URL/buildah:latest
  script: |
    buildah login -u $REPO_USERNAME -p $REPO_PASSWORD $REPO_URL
    buildah build -t $REPO_URL/garage --network=host ./garage/
    buildah push $REPO_URL/garage
